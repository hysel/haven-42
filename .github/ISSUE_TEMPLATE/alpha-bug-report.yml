name: Alpha problem report
description: Tell us about a reproducible problem in the unsigned Windows Alpha.
title: "[Alpha problem]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Haven 42. This is a public report.

        **Do not include** prompts, responses, attachment names or contents, API keys, passwords, private network addresses, hostnames, usernames, full local paths, machine identifiers, or screenshots containing personal information. Do not paste raw logs. If you saved a Haven 42 support report, open and review it before sharing its sanitized contents.

        Report a suspected vulnerability through [private vulnerability reporting](https://github.com/hysel/haven-42/security/advisories/new), not here.
  - type: input
    id: version
    attributes:
      label: Haven 42 version
      description: Copy the version shown on the About page.
      placeholder: 0.4.0-alpha.1
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: Package SHA-256
      description: Copy the published checksum if you verified it. Do not enter a local path.
      placeholder: 64 hexadecimal characters, or Not checked
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - First launch or guided setup
        - Local AI installation or removal
        - Chat, writing, or summarization
        - Model selection
        - File or screenshot attachment
        - External Ollama connection
        - Resource or token information
        - Shutdown or restart
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: General computer details
      description: Include Windows edition/build, CPU family, RAM, and GPU model only. Do not include a computer name, username, serial number, or address.
      placeholder: Windows 11 build 26100; AMD CPU; 32 GiB RAM; Radeon RX 7800 XT
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use synthetic example text and omit private file names or content.
      placeholder: |
        1. Open Haven 42.
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include an on-screen error or sanitized support-report reference when available. Do not paste private content or raw logs.
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Every time
        - Intermittent
        - Once
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocked from using Haven 42
        - Feature is degraded
        - Cosmetic or wording problem
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report and removed secrets, private content, addresses, identity, machine identifiers, and local paths.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
