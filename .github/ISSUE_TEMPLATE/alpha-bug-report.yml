name: Alpha problem report
description: Tell us about a reproducible problem in the unsigned Windows Alpha.
title: "[Alpha problem]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Haven 42. This is a public report.

        **Do not include** prompts, responses, attachment names or contents, API keys, passwords, private network addresses, hostnames, usernames, full local paths, machine identifiers, or screenshots containing personal information. Do not paste raw logs.

        If you opened this form from Haven 42, you can paste the short computer-details block that Haven 42 prepared for you. Review it before submitting. You do not need to find version numbers or checksums yourself.

        If you need help before opening a public issue, email haven42localai@gmail.com. Do not email passwords, API keys, private prompts, attached files, or raw logs.

        Report a suspected vulnerability through [private vulnerability reporting](https://github.com/hysel/haven-42/security/advisories/new), not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - First launch or guided setup
        - Local AI installation or removal
        - Chat, writing, or summarization
        - Model selection
        - File or screenshot attachment
        - External Ollama connection
        - Resource or token information
        - Shutdown or restart
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the message or behavior you saw. A short explanation is enough. Do not paste private content or raw logs.
      placeholder: I selected guided setup, and then…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What were you doing? (optional)
      description: Add a few simple steps if you remember them. Omit private file names or content.
      placeholder: |
        1. Open Haven 42.
        2. Choose ...
        3. Observe ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? (optional)
  - type: dropdown
    id: frequency
    attributes:
      label: Does it happen again?
      options:
        - Every time
        - Sometimes
        - It happened once
        - I am not sure
    validations:
      required: true
  - type: textarea
    id: safe_details
    attributes:
      label: Computer details prepared by Haven 42 (optional)
      description: Paste the short block copied from Haven 42. You can leave this empty.
      placeholder: Haven 42 version, Windows version, memory, and graphics information
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed this report, removed private information, and understand that suspected security vulnerabilities should be reported privately.
          required: true
